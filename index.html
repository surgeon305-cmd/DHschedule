<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도희 · 효중 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F7F5F0;
    --bg2: #EFEDE6;
    --bg3: #E5E2D8;
    --card: #FFFFFF;
    --text: #1A1916;
    --text2: #6B6860;
    --text3: #9E9C96;
    --border: rgba(26,25,22,0.1);
    --border2: rgba(26,25,22,0.18);
    --crew-bg: #E8F0FB;
    --crew-text: #1A4A8C;
    --crew-border: #B8CFF0;
    --doc-bg: #E6F4EC;
    --doc-text: #1A6B3A;
    --doc-border: #A8D8B8;
    --off-bg: #F0EEE8;
    --off-text: #5A5850;
    --together-bg: #FFF8E8;
    --together-border: #E8C84A;
    --rest-bg: #F5F3EE;
    --rest-text: #7A7868;
    --sth-bg: #EEE8F8;
    --sth-text: #5A3A9A;
    --stb-bg: #FCEEF4;
    --stb-text: #8A2A5A;
    --rdo-bg: #FEF3E8;
    --rdo-text: #8A4A1A;
    --accent: #C8A84A;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .page {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }

  /* Header */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 2rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  .header-left h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
  }
  .header-left .sub {
    font-size: 13px;
    color: var(--text3);
    margin-top: 3px;
    font-weight: 300;
  }
  .status-dot {
    width: 8px; height: 8px;
    background: #4CAF76;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .sync-label {
    font-size: 12px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
  }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    margin-bottom: 1.5rem;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text2);
    font-weight: 400;
  }
  .legend-pip {
    width: 20px; height: 6px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* People tabs */
  .people-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1.5rem;
  }
  .person-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
  }
  .person-avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
  }
  .avatar-crew { background: var(--crew-bg); color: var(--crew-text); }
  .avatar-doc  { background: var(--doc-bg);  color: var(--doc-text);  }

  /* Calendar grid */
  .cal-dow {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 3px;
  }
  .cal-dow div {
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    padding: 4px 0;
    letter-spacing: 0.08em;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .day {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 8px 8px;
    min-height: 88px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .day:hover {
    border-color: var(--border2);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    z-index: 1;
  }
  .day.empty {
    background: transparent;
    border-color: transparent;
    cursor: default;
    pointer-events: none;
  }
  .day.together {
    background: var(--together-bg);
    border-color: var(--together-border);
  }
  .day.today {
    border-color: var(--accent);
    border-width: 1.5px;
  }
  .day-num {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    line-height: 1;
    margin-bottom: 2px;
  }
  .day.weekend .day-num { color: var(--text3); }
  .day.together .day-num { color: #7A6010; }
  .divider-line {
    height: 1px;
    background: var(--border);
    margin: 1px 0;
    flex-shrink: 0;
  }
  .tag {
    font-size: 9.5px;
    font-weight: 500;
    padding: 2px 5px;
    border-radius: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.5;
    flex-shrink: 0;
  }
  .tag-flight { background: var(--crew-bg); color: var(--crew-text); }
  .tag-rest   { background: var(--rest-bg); color: var(--rest-text); }
  .tag-off    { background: var(--off-bg);  color: var(--off-text);  }
  .tag-rdo    { background: var(--rdo-bg);  color: var(--rdo-text);  }
  .tag-stb    { background: var(--stb-bg);  color: var(--stb-text);  }
  .tag-sth    { background: var(--sth-bg);  color: var(--sth-text);  }
  .tag-doc-on  { background: var(--doc-bg);  color: var(--doc-text);  }
  .tag-doc-off { background: var(--off-bg);  color: var(--off-text);  }
  .tag-doc-empty {
    background: transparent;
    color: var(--text3);
    border: 1px dashed var(--border2);
    font-weight: 400;
  }
  .together-mark {
    position: absolute;
    top: 5px; right: 6px;
    font-size: 10px;
  }

  /* Summary */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 1.25rem;
  }
  .sum-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .sum-label {
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 5px;
    font-weight: 400;
  }
  .sum-val {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    letter-spacing: -0.02em;
  }
  .sum-unit {
    font-size: 12px;
    font-weight: 400;
    color: var(--text3);
    margin-left: 2px;
  }

  /* Modal */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,18,14,0.5);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 1.5rem;
    width: 100%;
    max-width: 320px;
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(12px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .modal-date {
    font-size: 13px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    margin-bottom: 4px;
  }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 1.25rem;
    letter-spacing: -0.02em;
  }
  .section-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  .section-label:first-of-type { margin-top: 0; }
  select, input[type=text] {
    width: 100%;
    padding: 9px 11px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    transition: border-color 0.15s;
  }
  select:focus, input:focus { border-color: var(--accent); }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 1.25rem;
  }
  .btn {
    flex: 1;
    padding: 10px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--bg2); }
  .btn-save {
    background: var(--text);
    color: var(--bg);
    border-color: transparent;
  }
  .btn-save:hover { background: #3A3830; }
  .loading-bar {
    height: 2px;
    background: var(--accent);
    width: 0%;
    position: fixed;
    top: 0; left: 0;
    z-index: 999;
    transition: width 0.3s;
  }
  .toast {
    position: fixed;
    bottom: 1.5rem; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 99px;
    opacity: 0;
    transition: all 0.25s;
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 600px) {
    .day { min-height: 70px; padding: 5px 5px 6px; }
    .tag { font-size: 8.5px; padding: 1px 4px; }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .header-left h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="loading-bar" id="loadingBar"></div>
<div class="toast" id="toast"></div>

<div class="page">
  <div class="header">
    <div class="header-left">
      <h1>도희 · 효중 &nbsp;5월</h1>
      <div class="sub">2026년 5월 공유 캘린더</div>
    </div>
    <div class="sync-label">
      <span class="status-dot"></span>실시간 동기화
    </div>
  </div>

  <div class="people-row">
    <div class="person-badge">
      <div class="person-avatar avatar-crew">DH</div>
      <span>도희 — 승무원</span>
    </div>
    <div class="person-badge">
      <div class="person-avatar avatar-doc">HJ</div>
      <span>효중 — 공중보건의</span>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-pip" style="background:var(--crew-bg);border:1px solid var(--crew-border)"></div>항공편</div>
    <div class="legend-item"><div class="legend-pip" style="background:var(--sth-bg);border:1px solid #C8A8E8"></div>STH 자택대기</div>
    <div class="legend-item"><div class="legend-pip" style="background:var(--stb-bg);border:1px solid #E8A8C8"></div>STB 공항대기</div>
    <div class="legend-item"><div class="legend-pip" style="background:var(--off-bg);border:1px solid var(--border2)"></div>OFF / REST</div>
    <div class="legend-item"><div class="legend-pip" style="background:var(--doc-bg);border:1px solid var(--doc-border)"></div>효중 섬근무</div>
    <div class="legend-item"><div class="legend-pip" style="background:var(--together-bg);border:1.5px solid var(--together-border)"></div>함께 있는 날 ✦</div>
  </div>

  <div class="cal-dow">
    <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>

  <div class="summary">
    <div class="sum-card"><div class="sum-label">비행 일수</div><div class="sum-val" id="sumFlight">—<span class="sum-unit"></span></div></div>
    <div class="sum-card"><div class="sum-label">OFF · RDO</div><div class="sum-val" id="sumOff">—<span class="sum-unit"></span></div></div>
    <div class="sum-card"><div class="sum-label">함께한 날</div><div class="sum-val" id="sumTogether">—<span class="sum-unit"></span></div></div>
    <div class="sum-card"><div class="sum-label">총 비행시간</div><div class="sum-val">104<span class="sum-unit">:15</span></div></div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" style="display:none" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-title" id="modalTitle"></div>

    <div class="section-label">도희 — 승무원</div>
    <select id="editCrew">
      <option value="flight">✈ 항공편 근무</option>
      <option value="rest">REST (비행 중 체류)</option>
      <option value="off">OFF</option>
      <option value="rdo">RDO (요청 휴무)</option>
      <option value="stb">STB — 공항 대기</option>
      <option value="sth">STH — 자택 대기</option>
    </select>
    <div style="margin-top:6px">
      <input type="text" id="editFlight" placeholder="항공편 번호 (예: YP801/802)" />
    </div>

    <div class="section-label" style="margin-top:14px">효중 — 공중보건의</div>
    <select id="editDoc">
      <option value="unknown">미입력</option>
      <option value="on">섬 근무</option>
      <option value="off">육지 (휴무)</option>
    </select>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-save" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://iqnrpyzsylsrvzmrcmti.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kWe4qSgbog0oekVa0cnhCw_5ByBm91z';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const CREW_DEFAULT = {
  1:  { type:'flight', flight:'YP622', note:'~0555' },
  2:  { type:'off',    flight:'',      note:'' },
  3:  { type:'sth',    flight:'',      note:'0600~1800' },
  4:  { type:'flight', flight:'YP801/802', note:'0735~1845' },
  5:  { type:'off',    flight:'',      note:'' },
  6:  { type:'flight', flight:'YP111', note:'1620~' },
  7:  { type:'rest',   flight:'',      note:'' },
  8:  { type:'rest',   flight:'YP112', note:'1425~' },
  9:  { type:'flight', flight:'YP112', note:'~2040' },
  10: { type:'off',    flight:'',      note:'' },
  11: { type:'off',    flight:'',      note:'' },
  12: { type:'stb',    flight:'',      note:'1430~1730' },
  13: { type:'flight', flight:'YP621', note:'1605~2110' },
  14: { type:'rest',   flight:'YP622', note:'2140~' },
  15: { type:'flight', flight:'YP622', note:'~0555' },
  16: { type:'off',    flight:'',      note:'' },
  17: { type:'flight', flight:'YP731/732', note:'0710~1540' },
  18: { type:'flight', flight:'YP101', note:'1120~' },
  19: { type:'rest',   flight:'',      note:'' },
  20: { type:'rest',   flight:'YP102', note:'0945~' },
  21: { type:'flight', flight:'YP102', note:'~1620' },
  22: { type:'off',    flight:'',      note:'' },
  23: { type:'off',    flight:'',      note:'' },
  24: { type:'sth',    flight:'',      note:'0600~1800' },
  25: { type:'flight', flight:'YP131', note:'1945~2300' },
  26: { type:'rest',   flight:'',      note:'' },
  27: { type:'rest',   flight:'',      note:'2355~' },
  28: { type:'flight', flight:'YP132', note:'' },
  29: { type:'flight', flight:'YP132', note:'~0545' },
  30: { type:'rdo',    flight:'',      note:'' },
  31: { type:'rdo',    flight:'',      note:'' },
};

let calData = {};
let editingDay = null;

function loading(on) {
  document.getElementById('loadingBar').style.width = on ? '70%' : '100%';
  if (!on) setTimeout(() => document.getElementById('loadingBar').style.width = '0', 400);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

async function fetchData() {
  loading(true);
  try {
    const { data, error } = await db.from('calendar_may2026').select('*');
    if (error) throw error;
    calData = {};
    (data || []).forEach(row => { calData[row.day] = row; });
  } catch(e) {
    showToast('데이터 불러오기 실패 — 오프라인 모드');
  }
  loading(false);
  renderGrid();
}

function getDay(d) {
  const saved = calData[d] || {};
  const def = CREW_DEFAULT[d] || {};
  return {
    crew_type:   saved.crew_type   ?? def.type    ?? 'off',
    crew_flight: saved.crew_flight ?? def.flight  ?? '',
    crew_note:   saved.crew_note   ?? def.note    ?? '',
    doc_status:  saved.doc_status  ?? 'unknown',
  };
}

const TAG_CLASS = { flight:'tag-flight', rest:'tag-rest', off:'tag-off', rdo:'tag-rdo', stb:'tag-stb', sth:'tag-sth' };
const CREW_LABEL = { flight:'항공편', rest:'REST', off:'OFF', rdo:'RDO', stb:'STB 대기', sth:'STH 자택' };

function isTogether(d) {
  const row = getDay(d);
  const crewFree = ['off','rdo'].includes(row.crew_type);
  const docFree  = row.doc_status === 'off';
  return crewFree && docFree;
}

function renderGrid() {
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  const startDow = 4; // May 1 2026 = Friday
  let flightDays=0, offDays=0, togetherDays=0;

  for (let i=0; i<startDow; i++) {
    const e = document.createElement('div');
    e.className = 'day empty';
    grid.appendChild(e);
  }

  for (let d=1; d<=31; d++) {
    const dow = (startDow + d - 1) % 7;
    const together = isTogether(d);
    const row = getDay(d);
    if (row.crew_type === 'flight') flightDays++;
    if (['off','rdo'].includes(row.crew_type)) offDays++;
    if (together) togetherDays++;

    const cell = document.createElement('div');
    cell.className = 'day' +
      (together ? ' together' : '') +
      (dow===0||dow===6 ? ' weekend' : '');
    cell.onclick = () => openModal(d);

    const num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;
    cell.appendChild(num);

    // Together mark
    if (together) {
      const mark = document.createElement('div');
      mark.className = 'together-mark';
      mark.textContent = '✦';
      cell.appendChild(mark);
    }

    // Crew tags
    const crewTag = document.createElement('span');
    crewTag.className = 'tag ' + (TAG_CLASS[row.crew_type] || 'tag-off');
    if (row.crew_type === 'flight' && row.crew_flight) {
      crewTag.textContent = row.crew_flight;
    } else {
      crewTag.textContent = CREW_LABEL[row.crew_type] || row.crew_type;
    }
    cell.appendChild(crewTag);

    if (row.crew_note) {
      const noteTag = document.createElement('span');
      noteTag.className = 'tag tag-rest';
      noteTag.textContent = row.crew_note;
      cell.appendChild(noteTag);
    }

    // Divider
    const div = document.createElement('div');
    div.className = 'divider-line';
    cell.appendChild(div);

    // Doc tag
    const docTag = document.createElement('span');
    const ds = row.doc_status;
    docTag.className = 'tag ' + (ds==='on'?'tag-doc-on':ds==='off'?'tag-doc-off':'tag-doc-empty');
    docTag.textContent = ds==='on'?'섬 근무':ds==='off'?'효중 육지':'효중 미입력';
    cell.appendChild(docTag);

    grid.appendChild(cell);
  }

  document.getElementById('sumFlight').innerHTML = flightDays + '<span class="sum-unit">일</span>';
  document.getElementById('sumOff').innerHTML    = offDays    + '<span class="sum-unit">일</span>';
  document.getElementById('sumTogether').innerHTML = togetherDays + '<span class="sum-unit">일</span>';
}

function openModal(day) {
  editingDay = day;
  const row = getDay(day);
  document.getElementById('modalDate').textContent = `2026년 5월 ${day}일`;
  document.getElementById('modalTitle').textContent = getDowLabel(day);
  document.getElementById('editCrew').value   = row.crew_type;
  document.getElementById('editFlight').value = row.crew_flight;
  document.getElementById('editDoc').value    = row.doc_status;
  document.getElementById('overlay').style.display = 'flex';
}

function getDowLabel(d) {
  const dows = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  return dows[(4 + d - 1) % 7];
}

function closeModal() {
  document.getElementById('overlay').style.display = 'none';
  editingDay = null;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}

async function saveEdit() {
  if (!editingDay) return;
  const crewType   = document.getElementById('editCrew').value;
  const crewFlight = document.getElementById('editFlight').value.trim();
  const docStatus  = document.getElementById('editDoc').value;
  const def = CREW_DEFAULT[editingDay] || {};

  const payload = {
    day:         editingDay,
    crew_type:   crewType,
    crew_flight: crewType==='flight' ? (crewFlight || def.flight || '') : '',
    crew_note:   def.note || '',
    doc_status:  docStatus,
  };

  loading(true);
  try {
    const { error } = await db.from('calendar_may2026')
      .upsert(payload, { onConflict: 'day' });
    if (error) throw error;
    calData[editingDay] = payload;
    showToast('저장됐어요 ✓');
  } catch(e) {
    showToast('저장 실패 — 다시 시도해주세요');
  }
  loading(false);
  closeModal();
  renderGrid();
}

// Realtime subscription
db.channel('calendar-changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'calendar_may2026' }, payload => {
    if (payload.new) {
      calData[payload.new.day] = payload.new;
      renderGrid();
      showToast('상대방이 일정을 수정했어요');
    }
  })
  .subscribe();

fetchData();
</script>
