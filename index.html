<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도희 · 효중 캘린더</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DH캘린더">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
  :root {
    --bg: #F7F5F0; --bg2: #EFEDE6; --bg3: #E5E2D8;
    --card: #FFFFFF; --text: #1A1916; --text2: #6B6860; --text3: #9E9C96;
    --border: rgba(26,25,22,0.1); --border2: rgba(26,25,22,0.18);
    --crew-bg: #E8F0FB; --crew-text: #1A4A8C; --crew-border: #B8CFF0;
    --doc-bg: #E6F4EC; --doc-text: #1A6B3A; --doc-border: #A8D8B8;
    --off-bg: #F0EEE8; --off-text: #5A5850;
    --together-bg: #FFF8E8; --together-border: #E8C84A;
    --rest-bg: #F5F3EE; --rest-text: #7A7868;
    --sth-bg: #EEE8F8; --sth-text: #5A3A9A;
    --stb-bg: #FCEEF4; --stb-text: #8A2A5A;
    --rdo-bg: #FEF3E8; --rdo-text: #8A4A1A;
    --accent: #C8A84A; --radius: 10px; --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  .page { max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  .header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
  .header-left h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
  .header-left .sub { font-size: 13px; color: var(--text3); margin-top: 3px; font-weight: 300; }
  .status-dot { width: 8px; height: 8px; background: #4CAF76; border-radius: 50%; display: inline-block; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .sync-label { font-size: 12px; color: var(--text3); font-family: 'DM Mono', monospace; }

  .people-row { display: flex; gap: 8px; margin-bottom: 1.25rem; }
  .person-badge { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 99px; font-size: 13px; font-weight: 500; }
  .person-avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; font-family: 'DM Mono', monospace; }
  .avatar-crew { background: var(--crew-bg); color: var(--crew-text); }
  .avatar-doc  { background: var(--doc-bg);  color: var(--doc-text);  }

  .month-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 1.25rem; padding: 10px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
  .month-nav-btn { width: 32px; height: 32px; border: 1px solid var(--border2); background: var(--bg); border-radius: var(--radius-sm); font-size: 20px; cursor: pointer; color: var(--text2); transition: background .15s; display: flex; align-items: center; justify-content: center; }
  .month-nav-btn:hover { background: var(--bg2); }
  .today-btn { padding: 5px 11px; font-size: 12px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); cursor: pointer; transition: background .15s; white-space: nowrap; }
  .today-btn:hover { background: var(--bg2); color: var(--text); }
  .month-nav-label { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; min-width: 110px; text-align: center; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 1.5rem; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text2); }
  .legend-pip { width: 20px; height: 6px; border-radius: 3px; flex-shrink: 0; }

  .cal-wrapper { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
  .cal-dow-cell { text-align: center; font-size: 11px; font-weight: 500; color: var(--text3); padding: 4px 0; letter-spacing: .08em; }

  .day { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 6px 7px; min-height: 78px; min-width: 0; overflow: hidden; cursor: pointer; transition: border-color .15s, box-shadow .15s; position: relative; display: flex; flex-direction: column; gap: 3px; }
  .day:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(0,0,0,.06); z-index: 1; }
  .day.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
  .day.together { background: var(--together-bg); border-color: var(--together-border); }
  .day.today { border-color: #DC2626; border-width: 1.5px; }
  .day-num { font-size: 12px; font-weight: 500; color: var(--text); font-family: 'DM Mono', monospace; line-height: 1; margin-bottom: 2px; }
  .day.saturday .day-num { color: #2563EB; }
  .day.sunday   .day-num { color: #DC2626; }
  .day.together .day-num { color: #7A6010; }
  .day.holiday  .day-num { color: #DC2626; }
  .day.today .day-num { font-weight: 700; color: #DC2626; }
  .tag-holiday { background: #FEE2E2; color: #991B1B; font-size: 8.5px; padding: 1px 4px; border-radius: 3px; font-weight: 600; flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .divider-line { height: 1px; background: var(--border); margin: 1px 0; flex-shrink: 0; }
  .tag { font-size: 9.5px; font-weight: 500; padding: 2px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; flex-shrink: 1; min-width: 0; max-width: 100%; }
  .tag-flight { background: var(--crew-bg); color: var(--crew-text); }
  .tag-rest   { background: var(--rest-bg); color: var(--rest-text); }
  .tag-off    { background: var(--off-bg);  color: var(--off-text);  }
  .tag-rdo    { background: var(--rdo-bg);  color: var(--rdo-text);  }
  .tag-stb    { background: var(--stb-bg);  color: var(--stb-text);  }
  .tag-sth    { background: var(--sth-bg);  color: var(--sth-text);  }
  .tag-doc-on  { background: var(--doc-bg);  color: var(--doc-text);  }
  .tag-doc-off { background: var(--off-bg);  color: var(--off-text);  }
  .tag-doc-empty { background: transparent; color: var(--text3); border: 1px dashed var(--border2); font-weight: 400; }
  .tag-custom      { background: var(--together-bg); color: #7A6010; border: 1px solid var(--together-border); }
  .tag-custom-crew { background: var(--crew-bg); color: var(--crew-text); }
  .tag-custom-doc  { background: var(--doc-bg);  color: var(--doc-text);  }
  .together-mark { position: absolute; top: 5px; right: 6px; font-size: 10px; }
  .owner-selector { display: flex; gap: 6px; margin-bottom: 6px; }
  .owner-btn { flex: 1; padding: 7px 4px; font-size: 12px; font-weight: 500; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); cursor: pointer; transition: all .15s; font-family: 'Noto Sans KR', sans-serif; }
  .owner-btn.active { border-color: var(--accent); color: var(--text); background: var(--together-bg); }
  .fetch-hint { font-size: 10px; color: var(--text3); margin-top: 3px; min-height: 14px; }
  .upload-btn { padding: 6px 12px; font-size: 12px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .upload-btn:hover { background: var(--bg2); color: var(--text); }
  .roster-modal { max-width: 460px; }
  .roster-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .roster-table th { font-size: 10px; color: var(--text3); text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); letter-spacing: .06em; text-transform: uppercase; }
  .roster-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .roster-table tr:last-child td { border-bottom: none; }
  .roster-tag { font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 3px; display: inline-block; }

  .summary { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 1.25rem; }
  .sum-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .sum-label { font-size: 11px; color: var(--text3); margin-bottom: 5px; }
  .sum-val { font-size: 22px; font-weight: 700; font-family: 'DM Mono', monospace; letter-spacing: -0.02em; }
  .sum-unit { font-size: 12px; font-weight: 400; color: var(--text3); margin-left: 2px; }

  .overlay { position: fixed; inset: 0; background: rgba(20,18,14,.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(2px); }
  .modal { background: var(--card); border: 1px solid var(--border2); border-radius: 14px; padding: 1.5rem; width: 100%; max-width: 320px; animation: slideUp .2s ease; }
  @keyframes slideUp { from{transform:translateY(12px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1rem; gap: 8px; }
  .modal-date { font-size: 13px; color: var(--text3); font-family: 'DM Mono', monospace; margin-bottom: 4px; }
  .modal-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .modal-edit-btn { padding: 5px 12px; font-size: 12px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); cursor: pointer; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
  .modal-edit-btn:hover { background: var(--bg2); color: var(--text); }
  .btn-del { padding: 3px 9px; font-size: 11px; font-family: 'Noto Sans KR', sans-serif; background: var(--bg); border: 1px solid #FCA5A5; border-radius: var(--radius-sm); color: #DC2626; cursor: pointer; transition: background .15s; white-space: nowrap; }
  .btn-del:hover { background: #FEE2E2; }
  .view-section { margin-bottom: 12px; }
  .view-section-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  .view-flight-link { font-size: 13px; font-weight: 600; color: var(--crew-text); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; background: var(--crew-bg); padding: 4px 10px; border-radius: 5px; }
  .view-flight-link:hover { text-decoration: underline; }

  .modal-tabs { display: flex; background: var(--bg); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 1rem; }
  .modal-tab { flex: 1; padding: 7px 4px; font-size: 12px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; background: transparent; border: none; border-radius: 4px; color: var(--text2); cursor: pointer; transition: all .15s; }
  .modal-tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .section-label { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; margin-top: 14px; }
  .section-label:first-of-type { margin-top: 0; }
  select, input[type=text] { width: 100%; padding: 9px 11px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); appearance: none; -webkit-appearance: none; outline: none; transition: border-color .15s; }
  select:focus, input:focus { border-color: var(--accent); }
  .doc-readonly { padding: 9px 11px; font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text2); }
  .modal-actions { display: flex; gap: 8px; margin-top: 1.25rem; }
  .btn { flex: 1; padding: 10px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; font-weight: 500; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: transparent; color: var(--text); cursor: pointer; transition: background .15s; }
  .btn:hover { background: var(--bg2); }
  .btn-save { background: var(--text); color: var(--bg); border-color: transparent; }
  .btn-save:hover { background: #3A3830; }

  .loading-bar { height: 2px; background: var(--accent); width: 0%; position: fixed; top: 0; left: 0; z-index: 999; transition: width .3s; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); font-size: 13px; padding: 10px 20px; border-radius: 99px; opacity: 0; transition: all .25s; z-index: 999; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn-short { display: none; }
  .time-clocks { display: flex; gap: 6px; }
  .time-clock { display: flex; flex-direction: column; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; min-width: 60px; }
  .time-clock-label { font-size: 9px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; line-height: 1.4; }
  .time-clock-val { font-size: 15px; font-weight: 700; font-family: 'DM Mono', monospace; letter-spacing: -0.02em; line-height: 1.2; }
  .time-clock-tz { font-size: 9px; color: var(--text3); font-family: 'DM Mono', monospace; line-height: 1.4; }
  .refresh-btn { width: 28px; height: 28px; border: 1px solid var(--border2); background: var(--bg); border-radius: var(--radius-sm); font-size: 17px; cursor: pointer; color: var(--text2); transition: background .15s, color .15s; display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; flex-shrink: 0; }
  .refresh-btn:hover { background: var(--bg2); color: var(--text); }
  .refresh-btn.spinning { animation: spin .5s linear; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .page { padding: 0.6rem 0.35rem 2rem; }
    .header { margin-bottom: 0.75rem; padding-bottom: 0.75rem; }
    .header-left h1 { font-size: 18px; }
    .header-left .sub { font-size: 11px; }
    .people-row { gap: 6px; margin-bottom: 0.75rem; }
    .person-badge { padding: 6px 10px; font-size: 11.5px; gap: 6px; }
    .month-nav { margin-bottom: 0.75rem; padding: 8px 10px; gap: 12px; }
    .month-nav-label { font-size: 15px; }
    .legend { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 0.75rem; padding: 8px 10px; gap: 6px 14px; }
    .legend-item { font-size: 10.5px; white-space: nowrap; }
    .cal-wrapper { gap: 2px; }
    .cal-dow-cell { font-size: 10px; padding: 2px 0; }
    .day { min-height: 65px; padding: 3px 3px 4px; gap: 1px; }
    .day-num { font-size: 10.5px; margin-bottom: 1px; }
    .tag { font-size: 7.5px; padding: 1px 3px; border-radius: 3px; line-height: 1.4; }
    .tag-holiday { font-size: 7px; padding: 1px 2px; }
    .divider-line { margin: 0; }
    .together-mark { font-size: 8px; }
    .summary { grid-template-columns: repeat(2,1fr); gap: 6px; margin-top: 0.75rem; }
    .sum-card { padding: 10px 12px; }
    .sum-val { font-size: 18px; }
    .header { align-items: center; }
    .header-right { gap: 5px; flex-wrap: nowrap; }
    .upload-btn { font-size: 11px; padding: 5px 8px; }
    .sync-label { display: none; }
    .time-clock { padding: 3px 7px; min-width: 50px; }
    .time-clock-val { font-size: 13px; }
    .time-clock-label { font-size: 8px; }
    .time-clock-tz { font-size: 8px; }
    .btn-full { display: none; }
    .btn-short { display: inline; }
  }
</style>
</head>
<body>
<div class="loading-bar" id="loadingBar"></div>
<div class="toast" id="toast"></div>

<div class="page">
  <div class="header">
    <div class="header-left">
      <h1>도희 · 효중</h1>
      <div class="sub">공유 캘린더 · 실시간 동기화</div>
    </div>
    <div class="header-right">
      <div class="time-clocks">
        <div class="time-clock">
          <span class="time-clock-label">도희</span>
          <span class="time-clock-val" id="clockDH">--:--</span>
          <span class="time-clock-tz" id="clockDHZone">—</span>
        </div>
        <div class="time-clock">
          <span class="time-clock-label">효중</span>
          <span class="time-clock-val" id="clockHJ">--:--</span>
          <span class="time-clock-tz">KST</span>
        </div>
      </div>
      <button class="upload-btn" onclick="triggerRosterUpload()"><span class="btn-full">📄 로스터 업로드</span><span class="btn-short">📄 로스터</span></button>
      <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()" title="새로고침">↻</button>
      <div class="sync-label"><span class="status-dot"></span>Live</div>
    </div>
  </div>
  <input type="file" id="rosterFileInput" accept=".pdf" style="display:none" onchange="handleRosterFile(event)">

  <div class="people-row">
    <div class="person-badge"><div class="person-avatar avatar-crew">DH</div><span>도희</span></div>
    <div class="person-badge"><div class="person-avatar avatar-doc">HJ</div><span>효중</span></div>
  </div>

  <div class="month-nav">
    <button class="month-nav-btn" onclick="prevMonth()">&#8249;</button>
    <span class="month-nav-label" id="monthLabel">2026년 5월</span>
    <button class="month-nav-btn" onclick="nextMonth()">&#8250;</button>
    <button class="today-btn" onclick="goToday()">오늘</button>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-pip" style="background:var(--crew-bg);border:1px solid var(--crew-border)"></div>항공편</div>
    <div class="legend-item"><div class="legend-pip" style="background:var(--sth-bg);border:1px solid #C8A8E8"></div>STH 자택대기</div>
    <div class="legend-item"><div class="legend-pip" style="background:var(--stb-bg);border:1px solid #E8A8C8"></div>STB 공항대기</div>
    <div class="legend-item"><div class="legend-pip" style="background:var(--off-bg);border:1px solid var(--border2)"></div>OFF / REST</div>
    <div class="legend-item"><div class="legend-pip" style="background:var(--doc-bg);border:1px solid var(--doc-border)"></div>효중 섬근무</div>
    <div class="legend-item"><div class="legend-pip" style="background:var(--together-bg);border:1.5px solid var(--together-border)"></div>함께 있는 날 ✦</div>
  </div>

  <div class="cal-wrapper" id="calWrapper"></div>

  <div class="summary">
    <div class="sum-card"><div class="sum-label">비행 일수</div><div class="sum-val" id="sumFlight">—</div></div>
    <div class="sum-card"><div class="sum-label">OFF · RDO</div><div class="sum-val" id="sumOff">—</div></div>
    <div class="sum-card"><div class="sum-label">함께한 날</div><div class="sum-val" id="sumTogether">—</div></div>
    <div class="sum-card"><div class="sum-label">추가 일정</div><div class="sum-val" id="sumEvents">—</div></div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" style="display:none" onclick="handleOverlayClick(event)">
  <div class="modal">
    <!-- 헤더 (항상 표시) -->
    <div class="modal-header">
      <div>
        <div class="modal-date" id="modalDate"></div>
        <div class="modal-title" id="modalTitle"></div>
      </div>
      <button class="modal-edit-btn" id="modalEditBtn" onclick="enterEditMode()">수정 ✎</button>
    </div>

    <!-- 뷰 모드 (기본) -->
    <div id="viewMode"></div>

    <!-- 편집 모드 -->
    <div id="editMode" style="display:none">
      <div class="modal-tabs">
        <button class="modal-tab active" id="tabBtnCrew" onclick="switchTab('crew')">도희 일정</button>
        <button class="modal-tab" id="tabBtnCustom" onclick="switchTab('custom')">일정 추가</button>
      </div>

      <!-- 탭1: 도희 일정 -->
      <div id="tabCrew">
        <div class="section-label" style="margin-top:0">도희 — 승무원</div>
        <select id="editCrew">
          <option value="flight">✈ 항공편 근무</option>
          <option value="rest">REST (비행 중 체류)</option>
          <option value="off">OFF</option>
          <option value="rdo">RDO (요청 휴무)</option>
          <option value="stb">STB — 공항 대기</option>
          <option value="sth">STH — 자택 대기</option>
        </select>
        <div style="margin-top:6px">

// AviationStack API (https://aviationstack.com — 무료: 월 100회)
const AVIATIONSTACK_KEY = ''; // 발급받은 API 키 입력
const _flightCache = {};

// ── 추가 일정 직렬화 헬퍼 ──
function parseCustomEvents(title, note, owner) {
  if (!title) return [];
  try {
    const parsed = JSON.parse(title);
    if (Array.isArray(parsed)) return parsed;
  } catch(e) {}
  return [{ title, note: note || '', owner: owner || '함께' }];
}
function serializeCustomEvents(events) {
  return {
    custom_title: events.length ? JSON.stringify(events) : '',
    custom_note:  events.length ? (events[0].note  || '') : '',
    event_owner:  events.length ? (events[0].owner || '함께') : '함께',
  };
}

// ── 유틸 ──
function toKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function daysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
const TODAY_KEY = toKey(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());

// ── 상태 ──
let curYear = 2026, curMonth = 4; // 0-indexed (4=5월)
let calData   = {}; // YYYY-MM-DD → calendar_events row
let jumunData = {}; // YYYY-MM-DD → schedule row
let editingDate = null;

// ── 로딩 / 토스트 ──
function loading(on) {
  const b = document.getElementById('loadingBar');
  b.style.width = on ? '70%' : '100%';
  if (!on) setTimeout(() => b.style.width = '0', 400);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── 데이터 로드 ──
async function fetchData() {
  loading(true);
  const mm    = String(curMonth + 1).padStart(2, '0');
  const from  = `${curYear}-${mm}-01`;
  const to    = `${curYear}-${mm}-${String(daysInMonth(curYear, curMonth)).padStart(2, '0')}`;
  try {
    const [{ data: evRows, error: e1 }, { data: jRows, error: e2 }] = await Promise.all([
      db.from('calendar_events').select('*').gte('date', from).lte('date', to),
      jumunDb.from('schedule').select('*').gte('date', from).lte('date', to),
    ]);
    if (e1) throw e1;
    calData = {};
    (evRows || []).forEach(r => { calData[r.date] = r; });
    jumunData = {};
    if (e2) {
      console.warn('jumun 로드 실패:', e2.message);
    } else {
      (jRows || []).forEach(r => { jumunData[r.date] = r; });
    }
  } catch(e) {
    showToast('데이터 불러오기 실패 — 오프라인 모드');
  }
  loading(false);
  renderGrid();
}

// ── 날짜별 데이터 ──
function getDayData(dateKey) {
  const day = parseInt(dateKey.split('-')[2]);
  const isMay = curYear === 2026 && curMonth === 4;
  const saved = calData[dateKey] || {};
  const def   = isMay ? (CREW_DEFAULT[day] || {}) : {};
  const jumun = jumunData[dateKey];

  let docStatus = 'unknown', isHandover = false, handoverTime = null;
  if (jumun) {
    docStatus    = jumun.worker === '효중' ? 'on' : 'off';
    isHandover   = !!jumun.is_handover;
    handoverTime = jumun.handover_time || null;
  }

  return {
    crew_type:     saved.crew_type    ?? def.type   ?? null,
    crew_flight:   saved.crew_flight  || def.flight || '',  // ||: 빈 문자열도 fallback
    crew_note:     saved.crew_note    ?? def.note   ?? '',
    doc_status:    docStatus,
    is_handover:   isHandover,
    handover_time: handoverTime,
    custom_events: parseCustomEvents(saved.custom_title || '', saved.custom_note || '', saved.event_owner || '함께'),
    custom_title:  saved.custom_title || '',
    custom_note:   saved.custom_note  || '',
    event_owner:   saved.event_owner  || '함께',
  };
}

function isTogether(dateKey) {
  const r = getDayData(dateKey);
  return r.crew_type !== null && ['off','rdo'].includes(r.crew_type) && r.doc_status === 'off';
}

function docLabel(docStatus, isHandover, handoverTime) {
  const ferry = handoverTime ? handoverTime.split(' ')[0] : ''; // '1항차'
  if (docStatus === 'on')  return isHandover ? `섬근무 🔄${ferry}` : '섬근무';
  if (docStatus === 'off') return isHandover ? `휴무 🔄${ferry}`   : '휴무';
  return '미입력';
}

// ── 캘린더 렌더 ──
function renderGrid() {
  const grid = document.getElementById('calWrapper');
  grid.innerHTML = '';
  const total    = daysInMonth(curYear, curMonth);
  const startDow = new Date(curYear, curMonth, 1).getDay();
  let flights=0, offs=0, togethers=0, events=0;

  // 요일 헤더
  [['일','#DC2626'],['월',''],['화',''],['수',''],['목',''],['금',''],['토','#2563EB']].forEach(([text, color]) => {
    const h = document.createElement('div');
    h.className = 'cal-dow-cell';
    h.textContent = text;
    if (color) h.style.color = color;
    grid.appendChild(h);
  });

  for (let i=0; i<startDow; i++) {
    const e = document.createElement('div'); e.className='day empty'; grid.appendChild(e);
  }

  for (let d=1; d<=total; d++) {
    const key     = toKey(curYear, curMonth, d);
    const dow     = new Date(curYear, curMonth, d).getDay();
    const together= isTogether(key);
    const row     = getDayData(key);

    if (row.crew_type === 'flight') flights++;
    if (['off','rdo'].includes(row.crew_type)) offs++;
    if (together) togethers++;
    events += row.custom_events.length;

    const holiday = getHoliday(key);

    const cell = document.createElement('div');
    cell.className = 'day' +
      (together        ? ' together' : '') +
      (dow === 6       ? ' saturday' : '') +
      (dow === 0       ? ' sunday'   : '') +
      (holiday         ? ' holiday'  : '') +
      (key===TODAY_KEY ? ' today'    : '');
    cell.onclick = () => openModal(key);

    // 날짜 숫자
    const num = document.createElement('div');
    num.className = 'day-num'; num.textContent = d; cell.appendChild(num);

    // 공휴일 태그
    if (holiday) {
      const ht = document.createElement('span');
      ht.className = 'tag-holiday'; ht.textContent = holiday; cell.appendChild(ht);
    }

    // 함께 마크
    if (together) {
      const mark = document.createElement('div');
      mark.className = 'together-mark'; mark.textContent = '✦'; cell.appendChild(mark);
    }

    // 도희 태그 (DB 또는 기본값 없으면 건너뜀) — 그리드는 약식, 상세는 팝업
    if (row.crew_type !== null) {
      const crewTag = document.createElement('span');
      crewTag.className = 'tag ' + (TAG_CLASS[row.crew_type] || 'tag-off');
      let crewText;
      if (row.crew_type === 'flight' && row.crew_flight) {
        crewText = row.crew_flight.split('/')[0]; // YP801만 표시
      } else if (row.crew_type === 'rest') {
        crewText = 'REST';
      } else {
        crewText = CREW_LABEL[row.crew_type] || row.crew_type;
      }
      crewTag.textContent = crewText;
      cell.appendChild(crewTag);
      // crew_note(시간)는 팝업에서만 표시
    }

    // 구분선
    const div = document.createElement('div'); div.className='divider-line'; cell.appendChild(div);

    // 효중 태그 (자동)
    const ds = row.doc_status;
    const docTag = document.createElement('span');
    docTag.className = 'tag ' + (ds==='on'?'tag-doc-on':ds==='off'?'tag-doc-off':'tag-doc-empty');
    docTag.textContent = docLabel(ds, row.is_handover, row.handover_time);
    cell.appendChild(docTag);

    // 추가 일정
    if (row.custom_events.length > 0) {
      const ev = row.custom_events[0];
      const evTag = document.createElement('span');
      const ownerCls = ev.owner === '도희' ? 'tag-custom-crew'
                     : ev.owner === '효중' ? 'tag-custom-doc'
                     : 'tag-custom';
      evTag.className = 'tag ' + ownerCls;
      evTag.textContent = row.custom_events.length > 1
        ? `● ${ev.title} +${row.custom_events.length - 1}`
        : `● ${ev.title}`;
      cell.appendChild(evTag);
    }

    grid.appendChild(cell);
  }

  document.getElementById('sumFlight').innerHTML   = `${flights}<span class="sum-unit">일</span>`;
  document.getElementById('sumOff').innerHTML      = `${offs}<span class="sum-unit">일</span>`;
  document.getElementById('sumTogether').innerHTML = `${togethers}<span class="sum-unit">일</span>`;
  document.getElementById('sumEvents').innerHTML   = `${events}<span class="sum-unit">개</span>`;
}

// ── 월 이동 ──
function updateMonthLabel() {
  document.getElementById('monthLabel').textContent = `${curYear}년 ${curMonth+1}월`;
}
function prevMonth() {

// ── 항공편 시간 조회 (AviationStack) ──
async function fetchFlightInfo(rawNum) {
  if (!AVIATIONSTACK_KEY) return null;
  const iata = rawNum.split('/')[0].trim().toUpperCase();
  if (!iata) return null;
  if (_flightCache.hasOwnProperty(iata)) return _flightCache[iata];
  try {
    const apiUrl = `http://api.aviationstack.com/v1/flights?access_key=${AVIATIONSTACK_KEY}&flight_iata=${iata}`;
    const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`, { signal: AbortSignal.timeout(6000) });
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    const f = json.data?.[0];
    if (!f) { _flightCache[iata] = null; return null; }
    const fmt = iso => { if (!iso) return ''; const d = new Date(iso); return `${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`; };
    const dep = fmt(f.departure?.scheduled);
    const arr = fmt(f.arrival?.scheduled);
    const info = { note: dep && arr ? `${dep}~${arr}` : dep || arr, dest: f.arrival?.iata || '' };
    _flightCache[iata] = info;
    return info;
  } catch(e) { _flightCache[iata] = null; return null; }
}

let _flightTimer = null;
function onFlightInput(val) {
  clearTimeout(_flightTimer);
  const hint = document.getElementById('flightHint');

      if (hint) hint.textContent = '시간 자동 입력 ✓';
    } else {

    }
  }, 1200);
}

async function handleRosterFile(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  loading(true);
  try {
    const text = await extractPdfText(file);
    _rosterParsed = parseRosterText(text);
    if (!_rosterParsed.length) throw new Error('파싱된 일정이 없습니다');
    trackEvent('roster_parse_success', { rows: _rosterParsed.length, year: curYear, month: curMonth + 1 });
    showRosterPreview();
  } catch(err) {
    showToast('파싱 실패 — ' + (err.message || 'PDF 형식 확인 필요'));
  }
  loading(false);
}

async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let full = '';
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    full += content.items.map(it => it.str).join(' ') + '\n';
  }
  return full;
}

function parseRosterText(text) {
  const tokens = text.split(/[\s\n\r]+/).filter(t => t.trim());
  const entries = [];
  let cur = null;

  for (const t of tokens) {
    // 날짜 숫자 (1~31)
    if (/^\d{1,2}$/.test(t)) {
      const d = parseInt(t);
      if (d >= 1 && d <= 31) {
        if (cur) entries.push(cur);
        cur = { day: d, type: null, flight: '', note: '' };
        continue;
      }
    }
    if (!cur) continue;

    // YP 편명 (YP801, YP801/802, YP801/YP802)
    if (/^YP\d{3,4}(?:\/(?:YP)?\d{3,4})?$/i.test(t)) {
      const code = t.toUpperCase();
      if (!cur.type) { cur.type = 'flight'; cur.flight = code; }
      else if (!cur.flight) cur.flight = code; // REST + 귀국편
      continue;
    }

    // 상태 코드
    if (/^(OFF|RDO|REST|STB|STH)$/i.test(t)) {
      if (!cur.type) cur.type = t.toLowerCase();
      continue;
    }

    // 시간 패턴: HHMM(L)~HHMM(L) / HHMM(L)~ / ~HHMM(L)
    let m;
    if ((m = t.match(/^(\d{4})(?:\(L\)|L)?~(\d{4})(?:\(L\)|L)?$/))) {
      cur.note = (cur.note ? cur.note + ' ' : '') + `${m[1]}~${m[2]}`;
    } else if ((m = t.match(/^(\d{4})(?:\(L\)|L)?~$/))) {
      cur.note = (cur.note ? cur.note + ' ' : '') + `${m[1]}~`;
    } else if ((m = t.match(/^~(\d{4})(?:\(L\)|L)?$/))) {
      cur.note = (cur.note ? cur.note + ' ' : '') + `~${m[1]}`;
    }
  }
  if (cur) entries.push(cur);
  return entries.filter(e => e.type !== null);
}

function rosterTypeStyle(type) {
  const map = {
    flight: `background:var(--crew-bg);color:var(--crew-text)`,
    rest:   `background:var(--crew-bg);color:var(--crew-text)`,
    off:    `background:var(--off-bg);color:var(--off-text)`,
    rdo:    `background:var(--rdo-bg);color:var(--rdo-text)`,
    stb:    `background:var(--stb-bg);color:var(--stb-text)`,
    sth:    `background:var(--sth-bg);color:var(--sth-text)`,
  };
  return map[type] || `background:var(--off-bg);color:var(--off-text)`;
}

async function fetchJumunOnly() {
  const mm   = String(curMonth + 1).padStart(2, '0');
  const from = `${curYear}-${mm}-01`;
  const to   = `${curYear}-${mm}-${String(daysInMonth(curYear, curMonth)).padStart(2, '0')}`;
  const { data: jRows, error } = await jumunDb
    .from('schedule').select('*').gte('date', from).lte('date', to);
  if (error) { console.warn('jumun 갱신 실패:', error.message); return; }
  jumunData = {};
  (jRows || []).forEach(r => { jumunData[r.date] = r; });
  renderGrid();
}

// 주문도 실시간 구독 (DB에 replication 설정 시 동작)
jumunDb.channel('jumun-schedule-changes')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule' }, payload => {
    if (payload.eventType === 'DELETE') {
      if (payload.old?.date) delete jumunData[payload.old.date];
      renderGrid();
      return;
    }
    const row = payload.new;
    if (!row?.date) return;
    const prefix = `${curYear}-${String(curMonth + 1).padStart(2, '0')}`;
    if (row.date.startsWith(prefix)) {
      jumunData[row.date] = row;
      renderGrid();
    }
  })
  .subscribe(status => {
    // 구독 실패 시 즉시 한 번 폴링으로 보완
    if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') fetchJumunOnly();
  });

// 60초마다 jumun 스케줄 재조회 (실시간 구독 fallback)
setInterval(fetchJumunOnly, 60000);

  btn?.classList.add('spinning');
  await fetchData();
  setTimeout(() => btn?.classList.remove('spinning'), 500);
}

// TODAY_KEY · getDayData 정의 후 시계 시작
setInterval(updateClocks, 1000);
updateClocks();

trackEvent('app_open', {
  standalone: window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
});
fetchData();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/DHschedule/service-worker.js').catch(() => {});
  });
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type === 'SW_UPDATED') window.location.reload();
  });
}
</script>
</body>
